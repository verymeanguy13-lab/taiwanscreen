# .github/workflows/quarterly-fundamentals.yml
#
# Runs quarterly to fetch balance sheet + book value from MOPS and populate
# debt_ratio and pb_ratio in the fundamentals table.
#
# This workflow handles Vercel free plan's 10s timeout by:
#   1. Calling /api/admin/mops-cache?type=balance_sheet  (fetches + caches in DB)
#   2. Calling /api/admin/mops-cache?type=book_value     (fetches + caches in DB)
#   3. Calling /api/admin/mops-apply                     (reads cache, upserts fundamentals)
#
# Each step is a fast single MOPS fetch that may take up to 30s —
# curl --max-time 60 handles this; GitHub Actions has no Vercel timeout.
#
# Schedule: 10:00 UTC on the 20th of Jan, Apr, Jul, Oct
#   Jan 20 → Q3 of previous year
#   Apr 20 → Q4 of previous year (safely published by now)
#   Jul 20 → Q1
#   Oct 20 → Q2
#
# One-time setup (do this now):
#   github.com/verymeanguy13-lab/taiwanscreen
#   → Settings → Secrets and variables → Actions → New repository secret
#   Name: CRON_SECRET   Value: mysecret123
#   Name: APP_URL       Value: https://taiwanscreen.vercel.app

name: Quarterly Fundamentals (debt_ratio + pb_ratio)

on:
  schedule:
    - cron: '0 10 20 1,4,7,10 *'
  workflow_dispatch:
    inputs:
      year:
        description: 'Year (e.g. 2025) — leave blank for auto'
        required: false
      season:
        description: 'Season 1-4 — leave blank for auto'
        required: false

jobs:
  backfill-fundamentals:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Build query string
        id: qs
        run: |
          if [ -n "${{ github.event.inputs.year }}" ] && [ -n "${{ github.event.inputs.season }}" ]; then
            echo "qs=?year=${{ github.event.inputs.year }}&season=${{ github.event.inputs.season }}" >> $GITHUB_OUTPUT
          else
            echo "qs=" >> $GITHUB_OUTPUT
          fi

      - name: Step 1 — fetch balance sheet from MOPS → cache in DB
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          URL="${APP_URL}/api/admin/mops-cache${{ steps.qs.outputs.qs }}"
          echo "POST $URL (type=balance_sheet)"
          RESPONSE=$(curl -s -w "\n%{http_code}" --max-time 120 \
            -X POST "${URL}" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"type":"balance_sheet"}')
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          echo "HTTP $HTTP_CODE: $BODY"
          [ "$HTTP_CODE" = "200" ] || exit 1

      - name: Step 2 — fetch book value from MOPS → cache in DB
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          URL="${APP_URL}/api/admin/mops-cache${{ steps.qs.outputs.qs }}"
          echo "POST $URL (type=book_value)"
          RESPONSE=$(curl -s -w "\n%{http_code}" --max-time 120 \
            -X POST "${URL}" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"type":"book_value"}')
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          echo "HTTP $HTTP_CODE: $BODY"
          [ "$HTTP_CODE" = "200" ] || exit 1

      - name: Step 3 — apply cached data → upsert fundamentals
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          URL="${APP_URL}/api/admin/mops-apply${{ steps.qs.outputs.qs }}"
          echo "POST $URL"
          RESPONSE=$(curl -s -w "\n%{http_code}" --max-time 120 \
            -X POST "${URL}" \
            -H "x-cron-secret: ${CRON_SECRET}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          echo "HTTP $HTTP_CODE: $BODY"
          [ "$HTTP_CODE" = "200" ] || exit 1
          echo "✅ Done: $BODY"