# .github/workflows/quarterly-fundamentals.yml
#
# Runs quarterly — fetches balance sheet + book value from MOPS and upserts
# debt_ratio and pb_ratio directly into Neon DB. No Vercel timeout issues.
#
# Schedule: 10:00 UTC on the 20th of Jan, Apr, Jul, Oct
#   Apr 20 → Q4 of previous year
#   Jul 20 → Q1
#   Oct 20 → Q2
#   Jan 20 → Q3 of previous year
#
# One-time setup:
#   github.com/verymeanguy13-lab/taiwanscreen
#   → Settings → Secrets and variables → Actions → New repository secret
#   Name: DATABASE_URL   Value: (your Neon connection string from .env.local)

name: Quarterly Fundamentals (debt_ratio + pb_ratio)

on:
  schedule:
    - cron: '0 10 20 1,4,7,10 *'
  workflow_dispatch:
    inputs:
      year:
        description: 'Year (e.g. 2025) — leave blank for auto'
        required: false
      season:
        description: 'Season 1-4 — leave blank for auto'
        required: false

jobs:
  backfill-fundamentals:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install @neondatabase/serverless node-fetch

      - name: Run fundamentals ingestion
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          INPUT_YEAR: ${{ github.event.inputs.year }}
          INPUT_SEASON: ${{ github.event.inputs.season }}
        run: node scripts/ingest-fundamentals.mjs